[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haven-backup-portal"
version = "0.1.0"
description = "Web portal to configure and monitor Borg backup destinations and retention policies."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "paramiko>=3.4",
    "cryptography>=42.0",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
